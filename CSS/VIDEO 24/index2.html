<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Room Layout Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background-color: #f0f0f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
        }
        #canvas-container {
            width: 90vw;
            height: 70vh;
            max-width: 1200px;
            max-height: 800px;
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #message-box {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            border-radius: 8px;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            pointer-events: none;
            text-align: center;
        }
        #controls {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            padding: 10px;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            width: 90vw;
            max-width: 600px;
        }
        .control-button {
            padding: 10px 20px;
            border-radius: 8px;
            background-color: #4f46e5;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s ease;
        }
        .control-button:hover {
            background-color: #4338ca;
        }
        .control-button:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div id="canvas-container">
        <canvas id="c"></canvas>
    </div>
    <div id="controls">
        <div id="reset-view" class="control-button">Reset View</div>
        <div id="reset-layout" class="control-button">Reset Layout</div>
    </div>
    <div id="message-box"></div>
    <!-- three.js and orbit controls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <script>
        window.onload = function() {
            // Check if THREE.js and OrbitControls are loaded
            if (typeof THREE === 'undefined' || typeof THREE.OrbitControls === 'undefined') {
                console.error("THREE.js or OrbitControls not loaded. Trying again in 100ms.");
                setTimeout(window.onload, 100);
                return;
            } else {
                console.log("THREE.js and OrbitControls loaded successfully.");
            }

            let scene, camera, renderer, controls;
            let raycaster, mouse, draggableObjects = [];
            let isDragging = false, currentDraggedObject = null;
            let originalPositions = {};
            const messageBox = document.getElementById('message-box');

            function showMessage(text) {
                messageBox.textContent = text;
                messageBox.style.opacity = '1';
                setTimeout(() => {
                    messageBox.style.opacity = '0';
                }, 3000);
            }

            function createRoom() {
                // Dimensions in abstract units
                const roomWidth = 10, roomDepth = 12, roomHeight = 3;
                
                // Floor
                const floorGeometry = new THREE.PlaneGeometry(roomWidth, roomDepth);
                const floorMaterial = new THREE.MeshStandardMaterial({ color: 0xcfcfc4, side: THREE.DoubleSide });
                const floor = new THREE.Mesh(floorGeometry, floorMaterial);
                floor.rotation.x = Math.PI / 2;
                floor.position.y = -roomHeight / 2;
                scene.add(floor);

                // Walls
                const wallMaterial = new THREE.MeshStandardMaterial({ color: 0xeeeeee, side: THREE.DoubleSide });

                // Back wall
                const backWallGeometry = new THREE.PlaneGeometry(roomWidth, roomHeight);
                const backWall = new THREE.Mesh(backWallGeometry, wallMaterial);
                backWall.position.set(0, 0, -roomDepth / 2);
                scene.add(backWall);

                // Left wall
                const leftWallGeometry = new THREE.PlaneGeometry(roomDepth, roomHeight);
                const leftWall = new THREE.Mesh(leftWallGeometry, wallMaterial);
                leftWall.rotation.y = Math.PI / 2;
                leftWall.position.set(-roomWidth / 2, 0, 0);
                scene.add(leftWall);

                // Right wall
                const rightWallGeometry = new THREE.PlaneGeometry(roomDepth, roomHeight);
                const rightWall = new THREE.Mesh(rightWallGeometry, wallMaterial);
                rightWall.rotation.y = -Math.PI / 2;
                rightWall.position.set(roomWidth / 2, 0, 0);
                scene.add(rightWall);

                // Internal walls and partitions based on the floor plan
                const internalWallMaterial = new THREE.MeshStandardMaterial({ color: 0xaaaaaa, side: THREE.DoubleSide });
                
                // Partition between living room and bedroom/dining
                const wall1 = new THREE.Mesh(new THREE.BoxGeometry(0.2, roomHeight, roomDepth * 0.4), internalWallMaterial);
                wall1.position.set(-2, 0, -2);
                scene.add(wall1);

                // Partition for bathroom and kitchen
                const wall2 = new THREE.Mesh(new THREE.BoxGeometry(roomWidth * 0.4, roomHeight, 0.2), internalWallMaterial);
                wall2.position.set(3, 0, 1.5);
                scene.add(wall2);

                const wall3 = new THREE.Mesh(new THREE.BoxGeometry(0.2, roomHeight, roomDepth * 0.2), internalWallMaterial);
                wall3.position.set(2, 0, 3.5);
                scene.add(wall3);
            }

            function createFurniture() {
                const furnitureGroup = new THREE.Group();

                // Double Bed
                const bedGeometry = new THREE.BoxGeometry(3, 0.5, 2.5);
                const bedMaterial = new THREE.MeshStandardMaterial({ color: 0x9c27b0, roughness: 0.8 });
                const bed = new THREE.Mesh(bedGeometry, bedMaterial);
                bed.position.set(-3.5, -roomHeight/2 + 0.25, 3);
                bed.name = 'Bed';
                furnitureGroup.add(bed);
                draggableObjects.push(bed);

                // Study Table
                const tableGeometry = new THREE.BoxGeometry(2, 0.8, 1);
                const tableMaterial = new THREE.MeshStandardMaterial({ color: 0x795548, roughness: 0.5 });
                const studyTable = new THREE.Mesh(tableGeometry, tableMaterial);
                studyTable.position.set(-3.5, -roomHeight/2 + 0.4, -4);
                studyTable.name = 'Study Table';
                furnitureGroup.add(studyTable);
                draggableObjects.push(studyTable);

                // Cupboard
                const cupboardGeometry = new THREE.BoxGeometry(2.5, 2, 1);
                const cupboardMaterial = new THREE.MeshStandardMaterial({ color: 0x607d8b, roughness: 0.4 });
                const cupboard = new THREE.Mesh(cupboardGeometry, cupboardMaterial);
                cupboard.position.set(3.5, -roomHeight/2 + 1, -4);
                cupboard.name = 'Cupboard';
                furnitureGroup.add(cupboard);
                draggableObjects.push(cupboard);
                
                // Dining Table
                const diningTableGeometry = new THREE.BoxGeometry(1.5, 0.8, 1.5);
                const diningTableMaterial = new THREE.MeshStandardMaterial({ color: 0x795548, roughness: 0.5 });
                const diningTable = new THREE.Mesh(diningTableGeometry, diningTableMaterial);
                diningTable.position.set(0.5, -roomHeight/2 + 0.4, 1.5);
                diningTable.name = 'Dining Table';
                furnitureGroup.add(diningTable);
                draggableObjects.push(diningTable);

                // Store initial positions for reset functionality
                draggableObjects.forEach(obj => {
                    originalPositions[obj.name] = obj.position.clone();
                });

                scene.add(furnitureGroup);
            }

            function setupScene() {
                // Initialize scene, camera, and renderer
                const canvas = document.getElementById('c');
                renderer = new THREE.WebGLRenderer({ antialias: true, canvas: canvas });
                renderer.setSize(canvas.clientWidth, canvas.clientHeight);
                renderer.setClearColor(0xf0f0f5);
                
                scene = new THREE.Scene();
                camera = new THREE.PerspectiveCamera(75, canvas.clientWidth / canvas.clientHeight, 0.1, 1000);
                camera.position.set(0, 10, 15);
                
                // Lighting
                const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
                scene.add(ambientLight);
                const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
                directionalLight.position.set(5, 10, 7.5);
                scene.add(directionalLight);

                // Controls
                controls = new THREE.OrbitControls(camera, renderer.domElement);
                controls.target.set(0, 0, 0);
                controls.update();
                controls.enableDamping = true;
                controls.dampingFactor = 0.25;

                // Raycaster for object selection
                raycaster = new THREE.Raycaster();
                mouse = new THREE.Vector2();
                
                // Create the environment
                createRoom();
                createFurniture();
            }

            function onPointerDown(event) {
                if (event.target !== renderer.domElement) return;
                
                // Get normalized device coordinates (-1 to +1) for mouse/touch
                const rect = renderer.domElement.getBoundingClientRect();
                mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
                mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
                
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(draggableObjects, true);

                if (intersects.length > 0) {
                    currentDraggedObject = intersects[0].object;
                    isDragging = true;
                    controls.enabled = false; // Disable orbit controls while dragging
                    showMessage(`Dragging: ${currentDraggedObject.name}`);
                }
            }

            function onPointerMove(event) {
                if (!isDragging || !currentDraggedObject) return;

                const rect = renderer.domElement.getBoundingClientRect();
                mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
                mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(scene.children.filter(obj => obj.geometry instanceof THREE.PlaneGeometry), true);

                if (intersects.length > 0) {
                    const newPosition = intersects[0].point;
                    currentDraggedObject.position.x = newPosition.x;
                    currentDraggedObject.position.z = newPosition.z;
                }
            }

            function onPointerUp() {
                isDragging = false;
                currentDraggedObject = null;
                controls.enabled = true;
            }

            function onWindowResize() {
                const container = document.getElementById('canvas-container');
                camera.aspect = container.clientWidth / container.clientHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(container.clientWidth, container.clientHeight);
            }

            function resetLayout() {
                draggableObjects.forEach(obj => {
                    if (originalPositions[obj.name]) {
                        obj.position.copy(originalPositions[obj.name]);
                    }
                });
                showMessage('Layout has been reset.');
            }

            function resetCamera() {
                controls.reset();
                showMessage('Camera view has been reset.');
            }

            // Event listeners
            window.addEventListener('resize', onWindowResize);
            renderer.domElement.addEventListener('mousedown', onPointerDown, false);
            renderer.domElement.addEventListener('mousemove', onPointerMove, false);
            renderer.domElement.addEventListener('mouseup', onPointerUp, false);
            renderer.domElement.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) onPointerDown(e.touches[0]);
            }, false);
            renderer.domElement.addEventListener('touchmove', (e) => {
                if (e.touches.length === 1) onPointerMove(e.touches[0]);
            }, false);
            renderer.domElement.addEventListener('touchend', onPointerUp, false);
            document.getElementById('reset-layout').addEventListener('click', resetLayout);
            document.getElementById('reset-view').addEventListener('click', resetCamera);

            function animate() {
                requestAnimationFrame(animate);
                controls.update();
                renderer.render(scene, camera);
            }
            
            setupScene();
            animate();
        };
    </script>
</body>
</html>
