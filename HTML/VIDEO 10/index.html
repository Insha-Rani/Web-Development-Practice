<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- if we want to play automatic video so first  we use muted attribute also -->
    <video src="video.mp4" height="255" controls autoplay muted></video>
    <audio src="audio.mp3" controls></audio>
    <svg height="100" width="100">
        <circle cx="50" cy="50" r="40" stroke="black" strok-width="3" fill="red" />
    </svg>
    <!-- if we take svg at file format so we use this line in under svg tag xmlns="http://www.w3.org/2000/svg" -->
    <img src="img.svg" alt="this my svg">
    <div>
        <iframe width="560" height="315" src="https://www.youtube.com/embed/ZXNYl3Yjm3g?si=yPDTlckieQTFv_1l&amp;start=3" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </div>

    <div>
    <iframe src="https://www.codewithharry.com/" width="550" height="500"></iframe>
    </div>
</body>
</html>
